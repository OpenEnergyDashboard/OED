services:
  # -------------------------
  # PostgreSQL Database
  # -------------------------
  database:
    build: ./containers/database/
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: pleaseChange
    volumes:
      - ./postgres-data:/var/lib/postgresql/data/pgdata

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # -------------------------
  # Web App (Node)
  # -------------------------
  web:
    build:
      context: ./
      dockerfile: ./containers/web/Dockerfile

    environment:
      OED_PRODUCTION: "no"
      OED_SERVER_PORT: "3000"
      OED_DB_USER: "oed"
      OED_DB_DATABASE: "oed"
      OED_DB_TEST_DATABASE: "oed_testing"
      OED_DB_PASSWORD: "opened"
      OED_DB_HOST: "database"
      OED_DB_PORT: "5432"
      OED_TOKEN_SECRET: "?"
      OED_LOG_FILE: "log.txt"

      TZ: "Etc/UTC"

      # stabilize Node memory (prevents OOM during schema init)
      NODE_OPTIONS: "--max-old-space-size=4096"

    volumes:
      - ./:/usr/src/app

    ports:
      - "3000:3000"
      - "9229:9229"

    depends_on:
      database:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    # FIXED: no empty args, no broken bash invocation
    command: ["bash", "./src/scripts/installOED.sh"]

  # -------------------------
  # Cypress (optional)
  # -------------------------
  cypress:
    image: cypress/included
    profiles: ["ui-testing"]

    environment:
      CYPRESS_BASE_URL: "http://web:3000"
      DISPLAY: ":99"

    working_dir: /usr/src/app

    depends_on:
      web:
        condition: service_healthy

    volumes:
      - ./:/usr/src/app

    entrypoint: >
      /bin/sh -c "
      rm -f /tmp/.X99-lock &&
      Xvfb :99 -screen 0 1024x768x16"

    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true